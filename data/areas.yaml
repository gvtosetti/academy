# Areas (disciplinas) da Academy. Recursos e notas podem ter VARIAS areas.
# A ordem aqui define a ordem dos chips. chip: false = aparece so nos filtros da Library.
# O validador exige pelo menos 2 itens por area (evita categorias vazias).
- id: data-science
