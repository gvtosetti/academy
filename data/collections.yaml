      note: Compara padrões de agentes lado a lado, em vez de defender um só.
    - id: dair-ml-papers-explained
      note: Um atalho para entender os papers que todo mundo cita.
    - id: llms-por-dentro
      note: Uma explicação visual de LLMs em português, pensada para quem não é da área.
    - id: stanford-ee292r
      note: IA aplicada à ciência, um bom contraponto ao foco em chatbots.

