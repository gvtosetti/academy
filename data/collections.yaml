# Colecoes editoriais da Academy.
#
# Colecoes NAO sao trilhas nem cursos: sao agrupamentos independentes e transversais.
# Um mesmo item pode estar em varias colecoes. Itens podem ser recursos (resources.yaml)
# ou notas (glossary.yaml / tips.yaml), com um comentario editorial opcional (`note`).
#
# layout: grid (cards em grade) | list (linhas compactas) | feature (cards com comentario)
#         | notes (blocos curtos de leitura) | shelf (prateleira compacta e discreta)
# home:   main (bloco central "Tools & Resources") | section (secao propria na home) | hidden
# A ordem do arquivo e a ordem na home. Quando um chip de area esta ativo, cada colecao
# mostra apenas itens daquela area e some se ficar vazia.

- id: tools-worth-knowing
  title: Tools & Libraries
  layout: grid
  home: main
  home_limit: 6
  items:
    - manim
    - duckdb
    - dair-prompt-engineering-guide
    - pytest
    - grill-me
    - motion
    - pre-commit
    - lottie-web
    - grill-with-docs
    - manim-explicacoes

