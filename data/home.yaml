# Worth Checking Out: escolhas da curadoria, com uma frase de por que vale a pena.
worth_checking_out:
  - id: grill-me
    note: Uma ideia simples que muda a forma de trabalhar com agentes de código, alinhando antes de executar.
  - id: train-llm-from-scratch
    note: É raro ver o ciclo completo de um modelo de linguagem em código legível, do dado ao modelo.
  - id: all-agentic-architectures
    note: Compara padrões de agentes lado a lado, em vez de defender um só.
  - id: dair-ml-papers-explained
    note: Um atalho para entender os papers que todo mundo cita.

