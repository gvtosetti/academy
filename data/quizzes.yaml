# Quizzes rapidos por conceito. `answer` e o indice (base 0) da opcao correta.

- id: q-tokens-1
  concept: tokens
  question: "O que é um token para um LLM?"
  options:
    - "Uma senha de acesso ao modelo"
    - "Um pedaço de texto (palavra, parte de palavra ou sinal) que o modelo lê e gera"
    - "Uma frase completa"
    - "Um documento inteiro"
  answer: 1
  explanation: "O modelo trabalha com unidades de um vocabulário fixo; custo e limite de contexto são contados nelas."

- id: q-tokenization-1
  concept: tokenization
  question: "Por que um LLM pode ter dificuldade em contar as letras de uma palavra?"
  options:
    - "Porque ele vê tokens (pedaços de palavras), não letras individuais"
    - "Porque não foi treinado com textos"
    - "Porque não sabe matemática de forma alguma"
  answer: 0
  explanation: "A tokenização agrupa caracteres em subpalavras, então a noção de letra isolada não é direta para o modelo."

- id: q-embeddings-1
  concept: embeddings
  question: "Em um bom espaço de embeddings, o que se espera de 'carro' e 'automóvel'?"
  options:
    - "Que fiquem distantes, pois são palavras diferentes"
    - "Que fiquem próximos, pois têm significado parecido"
    - "Que tenham exatamente o mesmo número de letras"
  answer: 1
  explanation: "Embeddings posicionam itens de significado semelhante perto uns dos outros, o que permite a busca semântica."

- id: q-transformer-1
  concept: transformer
  question: "Qual mecanismo é central na arquitetura Transformer?"
  options:
    - "Árvores de decisão"
    - "Atenção (attention)"
    - "Regras escritas manualmente"
  answer: 1
  explanation: "Blocos de self-attention permitem que cada token considere os demais tokens da sequência."

- id: q-context-window-1
  concept: context-window
  question: "O que acontece quando um documento é maior que a janela de contexto do modelo?"
  options:
    - "O modelo lê tudo normalmente"
    - "É preciso dividir, resumir ou recuperar só as partes relevantes (ex. RAG)"
    - "O modelo automaticamente se re-treina"
  answer: 1
  explanation: "A janela limita quantos tokens cabem de uma vez; técnicas como RAG selecionam o que entra."

- id: q-hallucination-1
  concept: hallucination
  question: "Qual prática mais ajuda a reduzir alucinações?"
  options:
    - "Pedir ao modelo para responder mais rápido"
    - "Fornecer fontes relevantes no contexto e pedir citações (grounding)"
    - "Usar mais emojis no prompt"
  answer: 1
  explanation: "Ancorar a resposta em evidências verificáveis reduz invencionices e permite conferir a resposta."

- id: q-rag-1
  concept: rag
  question: "Qual é a ideia central do RAG?"
  options:
    - "Re-treinar o modelo toda vez que um documento muda"
    - "Buscar trechos relevantes e entregá-los ao modelo antes de gerar a resposta"
    - "Gerar respostas aleatórias e escolher a mais longa"
  answer: 1
  explanation: "RAG combina recuperação de informação com geração, usando conhecimento atualizado sem re-treino."

- id: q-semantic-search-1
  concept: semantic-search
  question: "Por que sistemas RAG de produção costumam combinar busca semântica com BM25 (palavra-chave)?"
  options:
    - "Porque cada uma falha em casos diferentes, como siglas e códigos exatos"
    - "Porque BM25 é obrigatório por lei"
    - "Porque a busca semântica não funciona em português"
  answer: 0
  explanation: "A busca híbrida une o casamento exato de termos ao entendimento de significado."

- id: q-ai-agents-1
  concept: ai-agents
  question: "O que diferencia um agente de um chatbot simples?"
  options:
    - "O agente sempre responde em menos palavras"
    - "O agente decide os próximos passos, usa ferramentas e observa resultados até cumprir um objetivo"
    - "O agente não usa LLM"
  answer: 1
  explanation: "Agentes operam em ciclos de planejar, agir e observar, em vez de apenas responder uma mensagem."

- id: q-tool-calling-1
  concept: tool-calling
  question: "No tool calling, quem executa de fato a ferramenta?"
  options:
    - "O próprio LLM, internamente"
    - "A aplicação, que recebe a chamada estruturada do modelo e devolve o resultado"
    - "O usuário, manualmente, sempre"
  answer: 1
  explanation: "O modelo emite nome e argumentos; o código da aplicação executa e devolve o resultado ao contexto."

- id: q-evaluation-1
  concept: evaluation
  question: "Você mudou o prompt da sua aplicação. Como saber se melhorou?"
  options:
    - "Testar com uma pergunta e confiar na impressão"
    - "Rodar um conjunto fixo de casos de teste antes e depois e comparar"
    - "Perguntar ao modelo se ele melhorou"
  answer: 1
  explanation: "Avaliação sistemática com casos fixos transforma impressões em evidência comparável."

- id: q-inference-1
  concept: inference
  question: "Qual fase da inferência domina o tempo até a primeira palavra (TTFT)?"
  options:
    - "Prefill (processar o prompt)"
    - "Pré-treino"
    - "Fine-tuning"
  answer: 0
  explanation: "Antes de gerar o primeiro token, o modelo processa todo o prompt na fase de prefill."

- id: q-agent-skills-1
  concept: agent-skills
  question: "O que é uma agent skill, como as da coleção mattpocock/skills?"
  options:
    - "Um aplicativo executável instalado no sistema operacional"
    - "Um arquivo de instruções (ex. SKILL.md) que o assistente lê e segue"
    - "Um modelo de linguagem novo"
  answer: 1
  explanation: "Skills são conhecimento de processo em texto; o agente as carrega quando precisa."

- id: q-sdd-1
  concept: spec-driven-development
  question: "No Spec-Driven Development, qual é a fonte de verdade?"
  options:
    - "O código já escrito"
    - "A especificação com regras e critérios de aceite"
    - "O histórico do chat com o assistente"
  answer: 1
  explanation: "Tarefas, código, testes e revisões derivam da spec e são rastreáveis a ela."
