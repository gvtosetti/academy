  tags: [stanford, cs221, busca, mdp, aprendizado por reforco, redes bayesianas, logica, jogos]
  short_description: >-
    Disciplina de Stanford que apresenta a IA como um conjunto de técnicas matemáticas para resolver
    problemas reais: aprendizado, busca, decisão sob incerteza, jogos, redes bayesianas e lógica.
  plain_language_explanation: >-
    Antes dos LLMs, "inteligência artificial" já englobava muitas ideias: como um programa aprende com
    exemplos, como encontra o melhor caminho entre muitas opções, como decide quando o futuro é incerto,
    como joga contra um adversário e como raciocina com regras lógicas. Este curso apresenta esse mapa
    completo da IA e termina conectando-o aos modelos de linguagem e ao impacto da IA na sociedade.
  technical_explanation: >-
    Pelos títulos das 20 aulas: Learning I–III, Search I–II, Markov Decision Processes, Reinforcement
    Learning, Policy Gradient, Games I–II, Bayesian Networks (incluindo Gibbs sampling e aprendizado),
    Logic I–II, Language Models, AI & Society e AI Supply Chains. A descrição oficial enfatiza o uso de
    ferramentas matemáticas rigorosas para problemas do mundo real.
  why_it_matters: >-
    Muitos sistemas modernos (agentes que planejam, modelos treinados com reforço, avaliação
    probabilística) reutilizam ideias clássicas de busca, MDPs e inferência. Conhecê-las dá vocabulário
    e intuição para entender por que agentes e RLHF funcionam como funcionam.
  learning_outcomes:
    - Formular problemas como busca, MDP ou jogo e escolher a técnica adequada.
    - Entender os fundamentos de aprendizado supervisionado e de reforço (incluindo policy gradient).
    - Modelar incerteza com redes bayesianas e amostragem.
    - Relacionar técnicas clássicas de IA aos modelos de linguagem atuais.
  audience:
    - Estudantes de computação e profissionais que querem uma base ampla de IA.
    - Data Scientists que conhecem ML, mas não busca, planejamento e raciocínio probabilístico.
  prerequisites:
    required: []
    helpful:
      - Programação (Python), probabilidade, álgebra linear e cálculo básicos (recomendação da curadoria; não listados na playlist).
  key_concepts: [artificial-intelligence, machine-learning, llm]
  practical_applications:
    - Modelar problemas de planejamento e decisão (rotas, alocação, políticas) antes de recorrer a LLMs.
    - Entender a base teórica de agentes que planejam e de treinamento por reforço.
  study_guide:
    - Assista à aula 1 para entender a organização do curso.
    - Siga a ordem das aulas — os blocos (Learning, Search, MDP/RL, Games, Bayes, Logic) se apoiam uns nos outros.
    - Se o foco é LLMs, assista à aula 17 (Language Models) depois do bloco de Learning.
