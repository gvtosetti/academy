- id: grill-with-docs
  editorial_subcategory: ai-assisted-work
  use_cases: [review_code, manage_requirements, document_process]
  related_collections: [working-with-claude, technical-documentation]
  considerations:
    - "Assistentes de IA externos recebem o código e o contexto enviados; confirme quais serviços são autorizados antes de usá-los com dados ou código da organização."
  tagline: "Skill que revisa decisões técnicas com IA, confrontando o plano com a documentação do projeto."
  areas: [dev-backend, product]
  blurb: "Um workflow de IA para revisar decisões e ideias técnicas com apoio de documentação. O plano é confrontado com o vocabulário e as decisões já registradas do projeto."
  title: grill-with-docs
  url: https://github.com/mattpocock/skills/tree/main/skills/engineering/grill-with-docs
  provider: Matt Pocock
  type: tool
  category: software-engineering
  difficulty: intermediate
  language: en
  parent: mattpocock-skills
  sequence: 88
  added_on: 2026-11-19
  github_repo: mattpocock/skills
  tags: [agent skill, entrevista, design, adr, glossario, domain modeling]
  short_description: >-
    Skill que conduz uma entrevista rigorosa para afiar um plano ou design e, ao mesmo tempo, registra a
    documentação resultante — glossário do domínio e ADRs (registros de decisões de arquitetura).
  plain_language_explanation: >-
    Imagine um colega experiente que, antes de você começar a programar, faz todas as perguntas
    incômodas: "o que acontece se...?", "esse termo significa X ou Y?". Esta skill faz o agente agir
    assim e, enquanto conversa, anota as definições combinadas em um glossário e as decisões
    importantes em documentos de decisão. Você sai com um plano mais claro e com documentação pronta.
  technical_explanation: >-
    O SKILL.md é mínimo: declara `disable-model-invocation: true` (só roda quando chamada explicitamente)
    e instrui o agente a chamar duas outras skills — grilling e domain-modeling. A grilling organiza a
    entrevista como uma árvore de decisões trabalhada em rodadas: a cada rodada pergunta toda a
    "fronteira" (decisões cujos pré-requisitos já estão resolvidos), numera as perguntas, dá uma
    resposta recomendada e busca fatos no ambiente em vez de perguntar ao usuário. A domain-modeling
    desafia termos contra o GLOSSARY.md, propõe termos canônicos, testa cenários de borda, confere o
    código e só propõe ADR quando a decisão é difícil de reverter, surpreendente sem contexto e fruto
    de um trade-off real. A pasta também traz agents/openai.yaml.
  why_it_matters: >-
    Desalinhamento é a falha mais cara em desenvolvimento, com ou sem IA. Resolver ambiguidades e
    registrar decisões antes do código reduz retrabalho e preserva o "porquê" para quem vier depois.
  learning_outcomes:
    - Conduzir uma sessão de alinhamento estruturada com um agente antes de implementar.
    - Entender a ideia de árvore de decisões e "fronteira" de perguntas.
    - Manter um glossário de domínio vivo, sem detalhes de implementação.
    - Decidir quando uma decisão merece um ADR.
  audience:
    - Engenheiros e líderes técnicos que desenham features com assistentes de código.
    - Times que querem documentação de domínio sem burocracia.
  prerequisites:
    required:
      - Um assistente de código que suporte skills e a coleção instalada (as skills grilling e domain-modeling precisam estar disponíveis).
    helpful:
      - Noção do que são ADRs e glossários de domínio.
  key_concepts: [agent-skills, spec-driven-development, readme]
  practical_applications:
    - Afiar o design de uma nova feature e sair com GLOSSARY.md e ADRs atualizados.
    - Padronizar a linguagem do domínio entre produto e engenharia.
  study_guide:
    - Leia o SKILL.md do grill-with-docs e, em seguida, os de grilling e domain-modeling.
    - Leia ADR-FORMAT.md e GLOSSARY-FORMAT.md na pasta domain-modeling.
    - Teste em um plano pequeno e real; responda "yes" para aceitar as recomendações quando concordar.
  related_resources: [grill-me, sdd-emersonmendes]
  github_highlights:
    - {path: skills/engineering/grill-with-docs/SKILL.md, why: Definição da skill.}
    - {path: skills/productivity/grilling/SKILL.md, why: Mecânica da entrevista em rodadas.}
    - {path: skills/engineering/domain-modeling/SKILL.md, why: Regras de glossário e ADR.}
  verified:
    verified_on: 2026-11-19
    source_title: grill-with-docs
    source_description: "A relentless interview to sharpen a plan or design, which also creates docs (ADR's and glossary) as we go."
  metadata_status: verified

- id: grill-me
