    source_title: grill-me
    source_description: A relentless interview to sharpen a plan or design.
  metadata_status: verified

- id: sdd-emersonmendes
  editorial_subcategory: templates-standards
  use_cases: [manage_requirements, document_process]
  related_collections: [technical-documentation]
  tagline: "Template em português para desenvolvimento assistido por IA guiado por especificação (spec-driven development)."
  areas: [dev-backend, product]
  blurb: "Template em português para desenvolver com assistente de IA guiado por especificação: spec, tarefas, código e revisão. Para projetos que precisam de previsibilidade."
  title: "sdd — Template de Spec-Driven Development para Claude Code"
  url: https://github.com/emersonmendes/sdd
  provider: Emerson Mendes
  type: github
  category: software-engineering
  difficulty: intermediate
  language: multi
  sequence: 90
  added_on: 2026-11-19
  github_repo: emersonmendes/sdd
  tags: [spec-driven development, sdd, claude code, skills, specs, review, seguranca, owasp, template]
  short_description: >-
    Template reutilizável de skills, agentes e documentos para Claude Code que coloca o projeto em um fluxo
    de Spec-Driven Development: spec, tarefas, código, review de conformidade e análise de segurança.
  plain_language_explanation: >-
    Spec-Driven Development (SDD) é escrever o comportamento esperado antes de construir: um documento
    curto com objetivo, regras de negócio numeradas, fluxos e critérios de aceite verificáveis. Essa
    especificação vira a fonte de verdade — o código, os testes e as revisões derivam dela. Com um
    assistente de IA isso é ainda mais importante, porque o agente não consegue adivinhar requisitos.
    Este template instala esse fluxo no seu projeto, com um comando para cada etapa.
  technical_explanation: >-
    Segundo o README (disponível em pt-BR): skills com prefixo do projeto — start (spec.md, flows.md e
    rules.md em /specs/<feature>/), tasks (tasks.md por app/módulo/camada), code (implementação com
    testes e lint), review (conformidade com spec, arquitetura e testes), security (checklist AppSec com
    achados mapeados em OWASP e gate sem Crítico/Alto aberto), go (os cinco passos com check-points),
    express, fix, reverse (spec a partir de código legado), ask, commit (varredura de vazamentos) e
    update (merge 3-way com o template). Inclui agentes techlead e <app>-dev, e docs como CLAUDE.md,
    ai/module_map.md e ai/conventions.md.
  why_it_matters: >-
    Transforma "parece bom" em check-points revisáveis (spec → tarefas → código), torna testes
    rastreáveis às regras de negócio e coloca segurança como gate, não como lembrança. O próprio README
    recomenda pular o fluxo em protótipos descartáveis e usá-lo no que será mantido.
  learning_outcomes:
    - Explicar especificação, requisitos, regras de negócio e critérios de aceite.
    - Seguir a cadeia spec → tarefas → código → review → segurança.
    - Mapear critérios de aceite numerados para testes.
    - Trazer código legado para o fluxo gerando specs a partir do que existe.
  audience:
    - Desenvolvedores que usam Claude Code em projetos que serão mantidos.
    - Líderes técnicos que querem previsibilidade e rastreabilidade com IA.
  prerequisites:
    required:
      - Claude Code (o template é voltado a ele).
    helpful:
      - Experiência com testes automatizados e revisão de código.
      - Noções de segurança de aplicações (OWASP).
  key_concepts: [spec-driven-development, agent-skills, git, github-repository]
  practical_applications:
    - Especificar e implementar uma feature com check-points de aprovação em cada etapa.
    - Documentar features legadas com a skill reverse.
    - Evitar commits com segredos ou dados reais por meio da varredura do commit.
  study_guide:
    - Leia o README.pt-BR.md, em especial "O que é SDD, e por que usar" e a tabela de skills.
    - Explore a pasta template/ para ver os arquivos que serão renderizados no seu projeto.
    - Experimente o fluxo completo (go) em uma feature pequena; depois avalie o express para casos simples.
    - Compare com as skills de Matt Pocock (grill-me, to-spec) para entender abordagens diferentes.
  related_resources: [mattpocock-skills, grill-with-docs]
  github_highlights:
    - {path: README.pt-BR.md, why: Documentação completa em português.}
    - {path: template/, why: Arquivos renderizados em cada projeto.}
    - {path: setup/, why: Scripts de instalação do template.}
    - {path: .claude/, why: Configuração de skills e agentes.}
