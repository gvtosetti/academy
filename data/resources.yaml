    área (engineering, productivity, misc, in-progress) — por exemplo code-review, tdd, to-spec,
    to-tickets, triage, diagnosing-bugs, domain-modeling, grill-with-docs, grilling, grill-me, handoff.
    Algumas skills apenas compõem outras (ex.: grill-me invoca grilling).
