  short_description: >-
    Curso avançado que percorre todo o processo de desenvolvimento de um modelo de linguagem: tokenização,
    arquiteturas, GPUs e kernels, paralelismo, scaling laws, inferência, dados, avaliação e pós-treino.
  plain_language_explanation: >-
    Se "LLMs por Dentro" mostra o que acontece dentro de um modelo, este curso mostra o que é preciso
    para construir um: preparar dados em grande escala, escolher a arquitetura, fazer o treino caber em
    muitos chips, prever quanto o modelo melhora com mais recursos e, no fim, servir e alinhar o modelo.
    É conteúdo de engenharia de ponta, voltado a quem quer ir realmente fundo.
  technical_explanation: >-
    Pelos títulos: overview e tokenização; PyTorch (einops); arquiteturas; alternativas à atenção;
    GPUs e TPUs; kernels, Triton e XLA; paralelismo (2 aulas); scaling laws (2 aulas); inferência;
    avaliação; dados (fontes, datasets); mid/post-training; post-training com RLVR; alinhamento e
    multimodalidade; aula convidada. A descrição oficial fala em percorrer todo o processo de
    desenvolvimento de um modelo de linguagem.
  why_it_matters: >-
    Decisões de custo, latência e qualidade em produção dependem de entender hardware, paralelismo,
    inferência e dados. Este é um dos materiais abertos mais completos sobre o "como se faz" de LLMs.
  learning_outcomes:
    - Entender o pipeline completo de desenvolvimento de um LM, do tokenizer ao pós-treino.
    - Raciocinar sobre desempenho em GPU/TPU, kernels e estratégias de paralelismo.
    - Usar scaling laws para pensar em orçamento de computação.
    - Discutir otimizações de inferência e o papel dos dados na qualidade final.
