- id: manim
  editorial_subcategory: tools-libraries
  tagline: "Biblioteca Python para animações matemáticas, usada na explicação de algoritmos e conceitos estatísticos."
  areas: [creative-tech, data-science]
  blurb: "Uma biblioteca Python para criar animações matemáticas. Útil para visualizar algoritmos, conceitos estatísticos e explicações técnicas."
  title: Manim (Community Edition)
  url: https://github.com/ManimCommunity/manim
  provider: Manim Community
  type: framework
  icon_org: ManimCommunity
  category: creative-coding
  difficulty: intermediate
  language: en
  sequence: 102
  added_on: 2026-11-19
  github_repo: ManimCommunity/manim
  tags: [python, animacao matematica, 3blue1brown, video, algoritmos, educacao]
  short_description: >-
    Framework Python mantido pela comunidade para criar, por código, animações precisas de matemática e
    explicações visuais — o estilo popularizado pelos vídeos do 3Blue1Brown.
  plain_language_explanation: >-
    Em vez de arrastar objetos em um editor de vídeo, com Manim você escreve um pequeno programa em
    Python que diz "desenhe um quadrado, transforme-o em círculo, mostre esta fórmula" — e o Manim gera
    o vídeo. Por ser código, a animação é exata e reproduzível, ideal para explicar matemática,
    algoritmos e conceitos de IA (como vetores de embeddings ou o passo a passo de uma ordenação).
  technical_explanation: >-
    Segundo o README: motor de animação para vídeos matemáticos explicativos, usado para criar animações
    precisas programaticamente. A Community Edition (ManimCE) é um fork mantido pela comunidade do
    3b1b/manim original de Grant Sanderson; o README alerta que as instruções de instalação das duas
    versões não são intercambiáveis. Cenas são classes `Scene` com método `construct()`; há ambiente
    Jupyter online para experimentar e imagem Docker.
  why_it_matters: >-
    Visualizações precisas aceleram a compreensão de conceitos abstratos. Para quem ensina IA, dados ou
    algoritmos, Manim permite produzir material didático de alta qualidade e versionado como código.
  learning_outcomes:
    - Entender animação programática e quando ela supera ferramentas visuais.
    - Criar uma cena Manim simples com formas, transformações e texto.
    - Animar uma ideia matemática ou algoritmo passo a passo.
    - Diferenciar ManimCE de 3b1b/manim ao instalar e buscar ajuda.
  audience:
    - Educadores, criadores de conteúdo técnico e Data Scientists que explicam conceitos.
    - Desenvolvedores Python interessados em visualização.
  prerequisites:
    required:
      - Python básico (classes e métodos).
    helpful:
      - Noções de geometria e álgebra linear para animações matemáticas.
  key_concepts: [programmatic-animation, sdk]
  practical_applications:
    - Produzir uma animação explicando como funciona a atenção em um Transformer.
    - Criar vídeos curtos de algoritmos para treinamentos internos.
  study_guide:
    - Experimente primeiro no ambiente Jupyter online indicado no README, sem instalar nada.
    - Reproduza o exemplo SquareToCircle do README e altere parâmetros.
    - Siga a documentação oficial para instalação local da Community Edition.
    - Explore example_scenes/ para ideias de cenas.
  related_resources: [motion, lottie-web]
  github_highlights:
    - {path: example_scenes/, why: Cenas de exemplo prontas para estudar.}
    - {path: manim/, why: Código-fonte da biblioteca.}
    - {path: docs/, why: Fonte da documentação oficial.}
  links:
    - {label: Ver documentação, url: "https://docs.manim.community/en/stable/"}
    - {label: Experimentar online, url: "https://try.manim.community/"}
