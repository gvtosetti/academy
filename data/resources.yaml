  language: en
  parent: mattpocock-skills
  sequence: 87
  added_on: 2026-11-19
  github_repo: mattpocock/skills
  tags: [agent skill, entrevista, alinhamento, planejamento, decisao]
  short_description: >-
    Skill que faz o assistente entrevistar você de forma insistente para testar e afiar um plano,
    decisão ou ideia antes de agir.
  plain_language_explanation: >-
    Muitas vezes nós mesmos não sabemos exatamente o que queremos até alguém nos perguntar. Esta skill
    inverte o jogo: em vez de o agente sair executando, ele faz perguntas numeradas, uma rodada por vez,
    sempre sugerindo uma resposta recomendada. Só quando você confirma que chegaram a um entendimento
    comum é que ele parte para a ação. Funciona para código, mas também para qualquer plano.
  technical_explanation: >-
    O SKILL.md declara `disable-model-invocation: true` e apenas chama a skill grilling. Ela modela a
    conversa como uma árvore de decisões; a cada rodada pergunta todas as decisões da fronteira, cada
    uma com resposta recomendada e redigida para que "yes" aceite a recomendação; fatos do ambiente são
    buscados pelo agente (podendo usar um sub-agente) e decisões ficam com o usuário. A sessão termina
    quando a fronteira está vazia, e o agente não age antes da confirmação do usuário.
  why_it_matters: >-
    É a forma mais simples de evitar que um agente construa a coisa errada. Também é uma excelente
    introdução ao conceito de skills: cabe em poucas linhas e o efeito é imediato.
  learning_outcomes:
    - Usar um agente para testar um plano antes de executá-lo.
    - Entender como uma skill pode delegar para outra skill.
    - Separar fatos (que o agente busca) de decisões (que são suas).
  audience:
    - Pessoas começando a usar assistentes de código.
    - Qualquer profissional que queira estruturar decisões com ajuda de IA.
  prerequisites:
    required:
      - Um assistente compatível com skills e a coleção instalada (a skill grilling precisa estar disponível).
    helpful: []
  key_concepts: [agent-skills]
  practical_applications:
    - Revisar o escopo de uma tarefa antes de pedir a implementação.
    - Preparar uma decisão técnica ou de produto com perguntas estruturadas.
  study_guide:
    - Leia o SKILL.md do grill-me (2 linhas) e o da grilling (o procedimento real).
    - Rode em um plano pequeno; observe o formato das rodadas e das respostas recomendadas.
    - Evolua para grill-with-docs quando quiser registrar glossário e decisões.
  related_resources: [grill-with-docs, mattpocock-skills]
  github_highlights:
