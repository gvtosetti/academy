    tempo de teste, verificação robusta, aprendizado com feedback, planejamento e avaliação agêntica.
  plain_language_explanation: >-
    Um agente de IA não apenas responde: ele tenta, verifica se acertou, usa ferramentas, aprende com
    o resultado e tenta de novo. Este curso estuda como fazer agentes melhorarem — gastando mais
    "esforço de pensamento" quando necessário, checando as próprias respostas e aprendendo com
    feedback — e como avaliar agentes em tarefas longas.
  technical_explanation: >-
    Organizado em 9 partes: visão geral; test-time compute scaling; robust verification; learning from
    feedback with tools/code; planning and multi-step reasoning; train-time scaling / scaling RL;
    self-improvement e deep research agents; agentic evaluations e long-horizon tasks; áreas futuras de
    pesquisa. A descrição oficial informa tratar-se de gravações do curso de pós-graduação CS329A.
  why_it_matters: >-
    As fronteiras atuais de agentes (raciocínio estendido, verificadores, RL em tarefas agênticas) vêm
    dessas linhas de pesquisa. Entendê-las ajuda a projetar agentes mais confiáveis e a avaliar
    criticamente promessas de "agentes autônomos".
  learning_outcomes:
    - Entender como computação em tempo de teste melhora respostas de modelos.
    - Discutir técnicas de verificação e aprendizado com feedback de ferramentas e código.
