  short_description: >-
    Bootcamp com aulas sobre como construir e colocar no ar aplicações com LLMs: fundamentos, prompting,
    modelos aumentados (recuperação e ferramentas), UX, LLMOps e um projeto completo de referência.
  plain_language_explanation: >-
    Saber como um LLM funciona é diferente de saber construir um produto com ele. Este bootcamp trata da
    parte de engenharia e produto: como prototipar rapidamente, escrever bons prompts, conectar o modelo
    a documentos e ferramentas externas, desenhar a experiência do usuário e operar a aplicação depois
    que ela está no ar. Atenção: o conteúdo é de 2023 — os princípios continuam valiosos, mas várias
    ferramentas citadas evoluíram ou foram substituídas.
  technical_explanation: >-
    Aulas listadas na página oficial: Launch an LLM App in One Hour; LLM Foundations (speed-run de ML,
    Transformer, LLMs notáveis e seus datasets); Learn to Spell: Prompt Engineering (decomposição,
    chain-of-thought, autocrítica, ensembling, armadilhas de few-shot e tokenização); Augmented Language
    Models (conhecimento externo, índices vetoriais e gestão de embeddings, ferramentas externas); Project
    Walkthrough askFSDL (Q&A com fontes, ETL, deploy e monitoramento); UX for Language User Interfaces;
    LLMOps (comparar e avaliar modelos, gestão de prompts, TDD e CI para LLMs); What's Next?. Palestras
    convidadas: How To Train Your Own LLM (Reza Shabani), Agents (Harrison Chase) e Fireside Chat com
    Peter Welinder.
  why_it_matters: >-
    Organiza o "mapa" de uma aplicação LLM de ponta a ponta — do protótipo ao monitoramento — e ensina
    princípios duradouros (avaliar antes de trocar de modelo, versionar prompts, desenhar UX para
    incerteza) que valem independentemente da ferramenta da moda.
  learning_outcomes:
    - Descrever a arquitetura típica de uma aplicação baseada em LLM.
    - Aplicar técnicas de prompting como decomposição, chain-of-thought e autocrítica.
    - Explicar como índices vetoriais e ferramentas externas aumentam um LLM (base do RAG e de agentes).
    - Reconhecer práticas de LLMOps — avaliação, gestão de prompts, testes e CI.
    - Aplicar princípios de UX para interfaces baseadas em linguagem.
  audience:
    - Desenvolvedores e Data Scientists que vão construir a primeira aplicação com LLM.
    - Product managers e líderes técnicos que precisam de visão de ponta a ponta.
  prerequisites:
    required: []
    helpful:
      - Python e noções de APIs web.
      - Vocabulário básico de LLMs (tokens, embeddings) — veja os Quick Explainers em Tips & Insights.
  key_concepts: [llm, prompt-engineering, rag, embeddings, vector-database, llmops, evaluation, tool-calling]
