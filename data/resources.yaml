- id: motion
  editorial_subcategory: tools-libraries
  tagline: "Biblioteca de animação para interfaces web, voltada a microinterações e transições."
  areas: [creative-tech, dev-backend]
  blurb: "Biblioteca de animação para interfaces web. Útil para criar microinterações e transições que deixam produtos mais claros e agradáveis."
  title: Motion
  url: https://github.com/motiondivision/motion
  provider: Motion Division
  type: library
  category: creative-coding
  difficulty: intermediate
  language: en
  sequence: 100
  added_on: 2026-11-19
  github_repo: motiondivision/motion
  tags: [animacao, react, javascript, vue, gestos, springs, scroll, layout, framer motion]
  short_description: >-
    Biblioteca open source de animação para JavaScript, React e Vue (antiga Framer Motion), com gestos,
    springs, transições de layout, efeitos ligados ao scroll e timelines.
  plain_language_explanation: >-
    Uma biblioteca de animação é um conjunto de funções prontas para fazer elementos de uma página se
    moverem, aparecerem ou mudarem de forma suavemente, sem que você calcule cada quadro. Vale distinguir
    design de interação de decoração: animação de interação comunica algo ("este item foi movido",
    "este botão respondeu ao toque", "você está aqui no scroll"), enquanto decoração só enfeita — e,
    em excesso, atrapalha. Motion é uma ferramenta para o primeiro tipo, muito usada em React.
  technical_explanation: >-
    Segundo o README: API para React (`motion/react`), JavaScript (`animate`) e Vue (`motion-v`); motor
    híbrido que combina JavaScript com APIs nativas do navegador para animações aceleradas por GPU;
    TypeScript, tree-shakable; inclui gestos, springs, layout transitions, scroll-linked effects e
    timelines. O README informa que Framer Motion agora é Motion e cita 450+ exemplos oficiais.
  why_it_matters: >-
    Movimento bem aplicado melhora a compreensão de interfaces (continuidade, feedback, hierarquia).
    Saber usar uma biblioteca madura evita reinventar física de animação e problemas de performance.
  learning_outcomes:
    - Distinguir animação de interação de animação decorativa.
