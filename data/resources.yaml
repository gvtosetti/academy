  areas: [ai-llms, dev-backend, data-engineering]
  blurb: "Curso prático para construir, semana a semana, um assistente de pesquisa sobre papers: da ingestão e busca ao RAG agêntico monitorado. Mostra como RAG é feito em produção."
  title: "The Mother of AI Project — Phase 1 RAG Systems: arXiv Paper Curator"
  url: https://github.com/jamwithai/production-agentic-rag-course
  provider: Jam With AI
  type: github
  category: llm-engineering
  difficulty: advanced
  language: en
  sequence: 55
  added_on: 2026-11-19
  github_repo: jamwithai/production-agentic-rag-course
  tags: [rag, agentic rag, bm25, busca hibrida, opensearch, fastapi, airflow, langgraph, langfuse, redis, docker]
  short_description: >-
    Curso prático semana a semana: construir um assistente de pesquisa sobre papers do arXiv, evoluindo de
    busca por palavra-chave a busca híbrida, RAG completo, monitoramento e, por fim, Agentic RAG.
  plain_language_explanation: >-
    RAG (Retrieval-Augmented Generation) é dar ao LLM a capacidade de consultar documentos antes de
    responder, como um aluno que pode abrir o livro na prova. "Agentic RAG" vai além: o sistema decide
    quando buscar, avalia se o que encontrou é relevante e reformula a pergunta se necessário. Este
    projeto ensina a construir isso como em uma empresa — primeiro uma busca tradicional sólida, depois
    a camada semântica, a geração, o monitoramento e o agente — em vez de começar direto pelo vetor.
  technical_explanation: >-
    Conforme o README: semana 1 — infraestrutura com Docker, FastAPI, PostgreSQL, OpenSearch e Airflow;
    semana 2 — pipeline de ingestão e parsing de papers do arXiv; semana 3 — busca BM25 com filtros;
    semana 4 — chunking e busca híbrida (palavra-chave + semântica); semana 5 — pipeline RAG com LLM
    local, streaming e interface Gradio; semana 6 — monitoramento com Langfuse e cache com Redis;
    semana 7 — Agentic RAG com LangGraph (grading de documentos, reescrita de consulta, guardrails de
    fora-de-domínio, rastreamento de raciocínio) e bot no Telegram. Cada semana tem notebook, blog post
    e tag de código.
  why_it_matters: >-
    A maioria dos tutoriais de RAG pula a parte difícil (ingestão, qualidade de busca, observabilidade).
    Este curso mostra a sequência profissional e ajuda a entender por que busca por palavra-chave
    continua essencial em sistemas de produção.
  learning_outcomes:
    - Montar a infraestrutura de um sistema RAG com serviços containerizados.
    - Construir um pipeline de ingestão e parsing de documentos.
    - Implementar busca BM25 e evoluir para busca híbrida com chunking.
    - Integrar um LLM local com streaming em um pipeline RAG completo.
    - Adicionar observabilidade (tracing) e cache.
    - Evoluir para Agentic RAG com grading de documentos, reescrita de consulta e guardrails.
  audience:
    - Engenheiros de IA e back-end que querem levar RAG para produção.
    - Data Scientists com experiência em Python e Docker.
  prerequisites:
    required:
      - Docker Desktop com Docker Compose (citado no README).
      - Python 3.12+ e o gerenciador UV (citados no README).
      - 8 GB+ de RAM e 20 GB+ de disco livre (citados no README).
    helpful:
      - Noções de APIs REST e bancos de dados.
      - Conceitos de embeddings e busca semântica (veja Tips & Insights).
  key_concepts: [rag, semantic-search, embeddings, vector-database, reranking, ai-agents, observability, grounding]
  practical_applications:
    - Construir um assistente interno que responde com base em documentos da empresa.
    - Avaliar quando busca híbrida supera busca puramente vetorial.
    - Adicionar tracing a um pipeline RAG para depurar respostas ruins.
  study_guide:
    - Leia a seção "About This Course" e o diagrama de evolução da arquitetura.
    - Siga as semanas em ordem, usando a tag de código de cada semana (week1.0, week2.0...).
    - Leia o blog post de cada semana antes de executar o notebook correspondente.
    - Execute em ambiente isolado (Docker), configurando chaves no .env — nunca exponha segredos.
    - Ao chegar à semana 7, compare com os padrões de RAG do All Agentic Architectures.
  related_resources: [all-agentic-architectures, fsdl-llm-bootcamp-2023, dlai-evaluating-debugging-genai]
  github_highlights:
    - {path: notebooks/, why: Notebooks de cada semana do curso.}
    - {path: src/, why: "Serviços da aplicação (API, busca, RAG, agente)."}
    - {path: airflow/, why: Orquestração do pipeline de ingestão.}
    - {path: compose.yml, why: "Definição dos serviços (OpenSearch, PostgreSQL, Airflow...)."}
    - {path: .env.example, why: Variáveis de configuração necessárias.}
  verified:
    verified_on: 2026-11-19
    source_title: "The Mother of AI Project — Phase 1 RAG Systems: arXiv Paper Curator"
    license: MIT
    primary_language: Python
  metadata_status: verified
  metadata_notes: "O repositório não possui descrição curta no GitHub; o título exibido vem do README."

