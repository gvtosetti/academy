  areas: [dev-backend, product]
  blurb: "Skill que faz o assistente de IA entrevistar você antes de agir, testando seu plano com perguntas. Simples de usar e evita que o agente construa a coisa errada."
  title: grill-me
  url: https://github.com/mattpocock/skills/tree/main/skills/productivity/grill-me
  provider: Matt Pocock
  type: tool
  category: software-engineering
