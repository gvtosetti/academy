  short_description: >-
    Curso sobre avaliação, análise de resultados e depuração de aplicações de IA generativa.
    (Descrição em validação — a página oficial não pôde ser consultada automaticamente.)
  plain_language_explanation: >-
    Em software tradicional, um teste diz se a resposta está certa ou errada. Em IA generativa, a mesma
    pergunta pode gerar respostas diferentes, e "certo" muitas vezes é uma questão de grau. Avaliar é
    definir critérios e medir a qualidade de forma sistemática; rastrear experimentos é registrar cada
    tentativa (modelo, prompt, parâmetros, resultado) para comparar; depurar é investigar por que uma
    resposta saiu ruim. Este curso trata dessas práticas.
  technical_explanation: >-
    Os temas acima refletem o título e a descrição inicial fornecida à curadoria. O currículo detalhado,
    as ferramentas utilizadas e a duração NÃO foram verificados: a página oficial bloqueou o acesso
    automatizado (proteção anti-bot) na data da curadoria. Consulte a página do curso para o conteúdo exato.
  why_it_matters: >-
    Sem avaliação, não há como saber se uma mudança de prompt, modelo ou recuperação melhorou ou piorou a
    aplicação. Avaliação e rastreamento de experimentos são o que transforma tentativa-e-erro em engenharia.
  learning_outcomes:
    - Entender o que significa avaliar a qualidade de saídas de IA generativa.
    - Reconhecer o papel do rastreamento de experimentos na comparação de versões.
