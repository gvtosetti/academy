  plain_language_explanation: >-
    Uma "skill" de IA é um arquivo de instruções (geralmente um SKILL.md em Markdown) que ensina um
    assistente de código a executar um procedimento específico — por exemplo, entrevistar você antes de
    começar uma tarefa, revisar código ou escrever testes primeiro. Diferente de um pacote de software
    ou de um aplicativo, uma skill não é um programa que roda sozinho: é conhecimento de processo que o
    agente lê e segue. Por isso é fácil de ler, adaptar e combinar. Este repositório reúne as skills
    que o autor usa no dia a dia.
