- id: all-agentic-architectures
  editorial_subcategory: guides-roadmaps
  use_cases: [develop_ai_application]
  tagline: "Notebooks que implementam dezenas de arquiteturas de agentes de IA em formato comparável."
  areas: [ai-llms, dev-backend]
  blurb: "Catálogo executável de dezenas de arquiteturas de agentes, com notebooks comparáveis. Referência para escolher o padrão certo em vez de seguir a moda."
  title: Agentic Architectures (all-agentic-architectures)
  url: https://github.com/FareedKhan-dev/all-agentic-architectures
  provider: Fareed Khan
  type: github
  category: agents
  difficulty: advanced
  language: en
  sequence: 65
  added_on: 2026-11-19
  github_repo: FareedKhan-dev/all-agentic-architectures
  tags: [agentes, react, reflexion, tree of thoughts, lats, graphrag, memgpt, multi-agent, langgraph, benchmark]
  short_description: >-
    Biblioteca Python e "livro-texto executável" com dezenas de padrões de agentes — reflexão, busca,
    RAG, memória, ferramentas, multiagentes e segurança — cada um com notebook executado e benchmark.
  plain_language_explanation: >-
    Vale separar quatro coisas. Um chatbot apenas conversa. Um LLM com ferramentas pode, por exemplo,
    consultar uma busca ou uma calculadora quando pedido. Um agente decide sozinho, em ciclos, o que
    fazer a seguir — planeja, age, observa o resultado e corrige o rumo até cumprir um objetivo. Um
    sistema multiagente divide o trabalho entre vários agentes especializados que colaboram ou debatem.
    Este repositório cataloga os padrões conhecidos para construir agentes e mostra cada um funcionando.
  technical_explanation: >-
    O README descreve 36 arquiteturas (a descrição curta do GitHub cita 35) com contrato uniforme
    `.run(task)` sobre máquinas de estado LangGraph, suporte a vários provedores de LLM e notebooks
    executados. Famílias: Reasoning & Reflection (Reflection, Reflexion, Chain-of-Verification,
    Self-Discover, Constitutional AI); Sampling & Search (Self-Consistency, Tree of Thoughts, LATS...);
    Retrieval (Agentic RAG, CRAG, Self-RAG, Adaptive RAG, GraphRAG); Memory (MemGPT, Voyager...); Tools &
    Actions (Tool Use, ReAct, Planning, PEV, SWE-Agent, BrowserAgent); Multi-Agent (Blackboard, Debate,
    STORM, Mixture of Agents...); Safety & Routing (Dry-Run, Computer Use...). Destaca o padrão
    "deterministic-picker": o LLM decide atributos categóricos e o Python compõe a decisão final.
  why_it_matters: >-
    "Agente" virou um termo genérico. Conhecer os padrões nomeados, com referências acadêmicas e
    comparação lado a lado, permite escolher a arquitetura adequada ao problema em vez de copiar a
    última moda — e entender os custos (chamadas extras, latência) de cada escolha.
  learning_outcomes:
    - Distinguir chatbot, LLM com ferramentas, agente e sistema multiagente.
    - Reconhecer as principais famílias de arquiteturas agênticas e seus trade-offs.
    - Comparar variantes de RAG (Agentic, Corrective, Self, Adaptive, Graph).
    - Entender padrões de memória e de orquestração multiagente.
    - Aplicar gates determinísticos para tornar decisões de agentes mais confiáveis.
  audience:
    - Engenheiros desenvolvendo agentes em produção.
    - Data Scientists e pesquisadores que comparam abordagens agênticas.
  prerequisites:
    required:
      - Python intermediário.
      - Saber chamar um LLM via API.
    helpful:
      - Noções de LangGraph/LangChain.
      - Conceitos de RAG e tool calling (veja Tips & Insights).
  key_concepts: [ai-agents, tool-calling, multi-agent-systems, agent-orchestration, rag, evaluation]
  practical_applications:
    - Escolher entre ReAct, Planning ou Plan-Execute-Verify para um assistente que executa tarefas.
    - Prototipar um agente com autocrítica (Reflection) antes de investir em algo mais complexo.
    - Avaliar variantes de RAG para uma base de conhecimento corporativa.
  study_guide:
    - Use os "Learning paths" do próprio README - Beginner (Reflection, Tool Use, ReAct, Planning, Self-Consistency).
    - Depois siga o caminho RAG-focused ou Multi-agent conforme seu objetivo.
    - Leia o notebook de cada arquitetura antes de rodar código; rode só em ambiente isolado e com suas próprias chaves.
    - Consulte o leaderboard de benchmarks para comparar custo e desempenho entre padrões.
  related_resources: [production-agentic-rag-course, stanford-cs329a]
  github_highlights:
    - {path: notebooks/, why: Notebook executado para cada arquitetura.}
    - {path: src/, why: Biblioteca agentic_architectures com o contrato uniforme.}
    - {path: benchmarks/, why: Tarefas de benchmark e leaderboard comparativo.}
    - {path: docs/, why: Documentação das famílias de arquiteturas.}
  links:
    - {label: Ver documentação, url: "https://fareedkhan-dev.github.io/all-agentic-architectures/"}
  verified:
    verified_on: 2026-11-19
    source_title: Agentic Architectures
    license: MIT
    primary_language: Jupyter Notebook
    source_description: "35 production-grade agentic AI architectures (Reflexion, LATS, GraphRAG, MemGPT, Voyager, BrowserAgent, ...) — a Python library and runnable textbook with multi-provider LLM support and a 17-task benchmark leaderboard."
  metadata_status: verified
  metadata_notes: "O README cita 36 arquiteturas e a descrição do GitHub cita 35 (nov/2026)."

