  short_description: >-
    Aulas da disciplina de pós-graduação CS229, uma introdução ampla e matemática ao machine learning —
    de mínimos quadrados a redes neurais, clustering, diffusion models e LLMs.
  plain_language_explanation: >-
    Machine learning é ensinar o computador a encontrar padrões a partir de exemplos, em vez de programar
    cada regra. Este curso mostra as famílias clássicas de algoritmos (prever números, classificar,
    agrupar), explica como redes neurais aprendem e chega a tópicos atuais como modelos de difusão,
    aprendizado de representações e LLMs.
  technical_explanation: >-
    Pelos títulos das aulas: supervised learning setup, weighted least squares, família exponencial e GLMs,
    Gaussian Discriminant Analysis, divisão de dados e conselhos práticos, redes neurais (arquitetura e
    backprop), K-Means e GMM, EM e PCA, diffusion models, representation learning, LLMs e next-word
    prediction loss, Transformers e in-context learning, conceitos básicos de RL e policy gradient.
  why_it_matters: >-
    É a base matemática que explica por que modelos generalizam (ou não), como são treinados e como
    avaliá-los — conhecimento que continua essencial mesmo para quem trabalha só com LLMs.
  learning_outcomes:
    - Formular problemas de aprendizado supervisionado e escolher modelos adequados.
    - Entender treino de redes neurais via backpropagation.
    - Aplicar técnicas não supervisionadas (K-Means, GMM/EM, PCA).
    - Conectar a next-word prediction loss ao funcionamento de LLMs.
  audience:
    - Data Scientists consolidando fundamentos teóricos.
    - Engenheiros migrando para ML com base matemática.
