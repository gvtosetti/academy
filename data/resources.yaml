- id: llms-por-dentro
  editorial_subcategory: guides-roadmaps
  use_cases: [develop_ai_application]
  tagline: "Repositório em português que explica, sem formalismo matemático, como um LLM processa texto e gera respostas."
  areas: [ai-llms, data-science]
  blurb: "Série em português que explica, sem matemática pesada, como um LLM transforma texto em tokens e gera respostas. Bom ponto de partida para quem usa IA e quer entender o que acontece por dentro."
  title: LLMs por Dentro
  url: https://github.com/glaucia86/llms-por-dentro
  provider: Glaucia Lemos
  type: github
  category: llms
  difficulty: beginner
  language: pt
  sequence: 10
  added_on: 2026-11-19
  github_repo: glaucia86/llms-por-dentro
  tags: [llm, tokens, embeddings, transformer, atencao, inferencia, kv cache, latencia, portugues, slides]
  short_description: >-
    Série visual em português, em quatro encontros, que mostra o caminho do texto até a resposta
    dentro de um LLM — sem exigir conhecimento prévio de machine learning.
  plain_language_explanation: >-
    Quando você escreve uma pergunta para um assistente de IA, o modelo não "lê" palavras como nós:
    ele quebra o texto em pedaços (tokens), transforma cada pedaço em uma lista de números
    (embeddings), relaciona esses pedaços entre si e escolhe, um de cada vez, o próximo pedaço da
    resposta. Este material explica cada uma dessas etapas com desenhos e analogias do dia a dia,
    apresentando o termo técnico só depois de a ideia estar clara. É um ótimo primeiro contato para
    quem usa IA e quer entender o que acontece "por baixo do capô".
  technical_explanation: >-
    O foco declarado é a inferência de LLMs de texto causais (autoregressivos). Os quatro episódios
    cobrem: (1) tokenização por subwords, IDs e embeddings de tokens; (2) Transformer, hidden states,
    self-attention com Q/K/V e máscara causal; (3) logits, softmax, estratégias de seleção e geração
    autoregressiva; (4) prefill, decode, KV cache, TTFT e métricas de serving. O repositório é um
    pequeno motor de slides em HTML/JS nativo, com roteiro da apresentadora e build em Python puro.
  why_it_matters: >-
    Entender o mecanismo ajuda a usar IA melhor: explica por que o tamanho do texto importa (tokens e
    janela de contexto), por que respostas podem soar confiantes e estar erradas (geração
    probabilística) e por que algumas respostas demoram (prefill, decode e cache). É a base para
    conversar com times técnicos e para avançar a temas como RAG, agentes e custo de inferência.
  learning_outcomes:
    - Explicar o que é um token e por que modelos trabalham com subwords.
    - Descrever como embeddings transformam tokens em vetores numéricos.
    - Entender, em alto nível, o papel do Transformer e da self-attention.
    - Compreender como o modelo escolhe o próximo token (logits, softmax e estratégias de seleção).
    - Reconhecer as fases prefill e decode e o que é o KV cache na latência de resposta.
  audience:
    - Pessoas começando em IA que usam assistentes no dia a dia.
    - Profissionais de produto, gestão e negócios que querem vocabulário técnico correto.
    - Desenvolvedores que nunca estudaram o funcionamento interno de um LLM.
  prerequisites:
    required: []
    helpful:
      - "Familiaridade com o uso de algum assistente de IA (ex.: chat com LLM)."
  key_concepts: [llm, tokens, tokenization, embeddings, transformer, attention, inference, context-window]
  practical_applications:
    - Estimar o impacto do tamanho de prompts e documentos no custo e na latência de uma aplicação.
    - Explicar a stakeholders não técnicos por que um LLM pode "alucinar".
    - Usar o material como roteiro para uma apresentação interna sobre como LLMs funcionam.
  study_guide:
    - Abra o portal da série (GitHub Pages) e assista/percorra o episódio 01 — é o que está com apresentação pronta.
    - Após cada episódio, consulte em Tips & Insights os termos apresentados (tokens, embeddings, attention).
    - Leia os planos de aula dos episódios 02–04 na pasta episodes/ para antecipar os próximos temas.
    - Consulte references/README.md para as fontes públicas e os limites didáticos assumidos.
    - Leia as notas curtas de Tokens e Embeddings em Tips & Insights para fixar.
  related_resources: [stanford-cme295-2025, dair-transformers-recipe, train-llm-from-scratch]
  github_highlights:
    - {path: episodes/01-texto-aos-numeros/, why: "Slides, plano e roteiro completo do primeiro encontro."}
    - {path: episodes/04-latencia-inferencia/, why: "Plano do encontro sobre prefill, decode, KV cache e TTFT."}
    - {path: references/README.md, why: Fontes públicas e limites didáticos da série.}
    - {path: dist/episodio-01.html, why: Versão autocontida para apresentar offline.}
  links:
    - {label: Abrir portal da série, url: "https://glaucia86.github.io/llms-por-dentro/"}
  verified:
    verified_on: 2026-11-19
    source_title: LLMs por Dentro
    license: MIT
    primary_language: HTML
    duration: "4 encontros planejados (45 min de conteúdo + 5 min de perguntas cada), segundo o README"
    source_description: Uma série visual em português para entender o funcionamento dos LLMs, do texto à resposta, em quatro encontros.
  metadata_status: verified
  metadata_notes: "Segundo o README (nov/2026), apenas o episódio 01 tem apresentação e roteiro prontos; 02–04 têm plano de aula definido."

- id: train-llm-from-scratch
  editorial_subcategory: guides-roadmaps
  use_cases: [develop_ai_application]
  tagline: "Código passo a passo para treinar um modelo de linguagem pequeno do zero, da preparação do dataset ao treinamento."
  areas: [ai-llms, data-science]
  blurb: "Código passo a passo para treinar um pequeno modelo de linguagem do zero, do dataset ao modelo final. Para quem quer entender LLMs construindo um; ajuda ter Python e noções de deep learning."
  title: Train LLM From Scratch
  url: https://github.com/FareedKhan-dev/train-llm-from-scratch
  provider: Fareed Khan
  type: github
  category: llms
  difficulty: advanced
  language: en
  sequence: 60
  added_on: 2026-11-19
  github_repo: FareedKhan-dev/train-llm-from-scratch
  tags: [pytorch, pretraining, sft, rlhf, dpo, ppo, grpo, lora, moe, kv cache, transformer]
  short_description: >-
    Implementação em PyTorch puro de todo o ciclo de um LLM: dados, tokenização, Transformer,
    pré-treino, geração de texto, pós-treino (SFT, DPO, PPO, GRPO) e avaliação.
  plain_language_explanation: >-
    Existem três formas de "ter" um modelo de linguagem: usar um modelo pronto (via API ou download),
    ajustar um modelo existente aos seus dados (fine-tuning) ou treinar um do zero. Treinar do zero
    significa começar com um modelo que não sabe nada e ensiná-lo a prever a próxima palavra lendo
    muito texto — é caro e raramente necessário em produção, mas é a melhor forma de entender o que
    realmente acontece dentro de um LLM. Este repositório percorre esse caminho inteiro, em escala
    pequena, com código escrito à mão e explicações antes de cada bloco.
  technical_explanation: >-
    O autor implementa o Transformer de "Attention is All You Need" em PyTorch e, ao lado, uma versão
    moderna (rotary positions, RMSNorm, SwiGLU, grouped-query e latent attention, Mixture of Experts,
    KV cache). O README declara que os algoritmos são escritos sem trl, peft ou transformers: pré-treino
    com next-token loss, SFT com loss mask, reward model Bradley-Terry, PPO com GAE, DPO/ORPO/KTO,
    GRPO/RLVR, além de Muon, LoRA, speculative decoding e pesos int8. Há uma trilha para CPU (modelo
    pequeno) e orientações de GPU para modelos maiores; inclui painel Streamlit e site de documentação.
  why_it_matters: >-
    Quem trabalha com LLMs toma decisões como "usar API, fazer fine-tuning ou treinar?" e "por que
    este modelo se comporta assim após alinhamento?". Ver cada etapa implementada torna conceitos
    abstratos (loss, alinhamento, RLHF, KV cache) concretos e ajuda a avaliar trade-offs de custo e
    qualidade com mais segurança.
  learning_outcomes:
    - Diferenciar uso de modelo pronto, fine-tuning e treino do zero, com seus custos e motivações.
    - Construir um Transformer a partir de MLP, single-head e multi-head attention.
    - Executar um pré-treino pequeno e interpretar a curva de loss.
    - Entender o pós-treino que transforma um modelo base em assistente (SFT, reward model, DPO, PPO, GRPO).
    - Comparar a arquitetura original com componentes de modelos modernos (RoPE, RMSNorm, MoE, KV cache).
  audience:
    - Data Scientists e engenheiros de ML que querem entender LLMs em profundidade.
    - Estudantes de pós-graduação e pesquisadores interessados em pós-treino e alinhamento.
    - Desenvolvedores Python confortáveis com redes neurais.
  prerequisites:
    required:
      - Programação orientada a objetos em Python (citado no README).
      - Noções de redes neurais (citado no README).
      - PyTorch básico (citado no README).
    helpful:
      - Álgebra linear e cálculo básicos.
      - Ter estudado antes um material conceitual como "LLMs por Dentro".
      - Acesso a GPU para os modelos maiores (o README indica que o modelo pequeno roda em CPU).
  key_concepts: [training, fine-tuning, transformer, attention, tokenization, inference, neural-networks, evaluation]
  practical_applications:
    - Fundamentar a decisão técnica entre API, fine-tuning e treino próprio em um projeto.
    - Prototipar e comparar técnicas de alinhamento em pequena escala antes de usar bibliotecas prontas.
    - Criar material didático interno sobre pós-treino e RLHF.
  study_guide:
    - Leia as seções "Who this is for" e "Prerequisites and Training Time" do README para escolher sua trilha (CPU ou GPU).
    - Comece pela trilha "No GPU? Train on Your Laptop" para ver o ciclo completo funcionando rápido.
    - Siga os Steps 1–4 (dados, modelo, pré-treino, geração) lendo o código referenciado em src/.
    - Só depois avance ao Step 5 (pós-treino) — é a parte mais densa.
    - Execute o código apenas em um ambiente isolado (virtualenv ou container), nunca automaticamente.
  related_resources: [stanford-cs336-2026, llms-por-dentro, stanford-cme295-2025]
  github_highlights:
    - {path: README.md, why: "Tutorial completo, do dado bruto ao modelo alinhado (Steps 1–7)."}
    - {path: src/, why: Código-fonte dos modelos e algoritmos de treino.}
    - {path: POST_TRAINING.md, why: Detalhes do pós-treino.}
    - {path: sft_rlhf_guide.ipynb, why: Notebook guiado de SFT e RLHF.}
    - {path: configs/, why: Configurações de treino.}
  links:
    - {label: Ver documentação, url: "https://fareedkhan-dev.github.io/train-llm-from-scratch/"}
  verified:
    verified_on: 2026-11-19
    source_title: Train LLM From Scratch
    license: MIT
    primary_language: Python
    source_description: A straightforward method for training your LLM, from downloading data to generating text.
  metadata_status: verified

