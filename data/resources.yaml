- id: lottie-web
  editorial_subcategory: tools-libraries
  tagline: "Biblioteca que renderiza na web animações do After Effects exportadas em JSON, sem recriá-las em código."
  areas: [creative-tech]
  blurb: "Biblioteca que reproduz na web animações criadas no After Effects e exportadas como JSON. Permite usar animações de designers sem recriá-las em código."
  title: lottie-web
  url: https://github.com/airbnb/lottie-web
  provider: Airbnb
  type: library
  category: creative-coding
  difficulty: intermediate
  language: en
  sequence: 104
  added_on: 2026-11-19
  github_repo: airbnb/lottie-web
  tags: [lottie, after effects, bodymovin, json, animacao, web]
  short_description: >-
    Biblioteca que renderiza na web animações criadas no Adobe After Effects e exportadas como JSON
    (via plugin Bodymovin), com equivalentes para Android, iOS e React Native.
  plain_language_explanation: >-
    Um arquivo Lottie é uma animação descrita em JSON: em vez de um vídeo ou GIF, ele guarda formas,
    cores e movimentos como dados, que uma biblioteca "toca" na tela. A diferença para animações
    programáticas (como Motion ou Manim) é quem cria: aqui, o designer desenha a animação no After
    Effects e exporta; o desenvolvedor apenas a exibe, sem recriá-la em código. É ideal para ícones
    animados, ilustrações e telas de carregamento.
  technical_explanation: >-
    Segundo o README: lottie-web interpreta animações do After Effects exportadas em JSON com o
    Bodymovin e as renderiza nativamente; o plugin pode ser obtido via aescripts, Adobe Exchange ou
    instalação manual do .zxp. Há bibliotecas irmãs para Android, iOS, React Native e Windows. A
    documentação geral está em airbnb.io/lottie. O último push registrado no repositório foi em set/2025.
  why_it_matters: >-
    Separa o trabalho de design de movimento do de engenharia, reduzindo retrabalho e mantendo arquivos
    leves e escaláveis (vetoriais) em comparação a vídeos ou GIFs.
  learning_outcomes:
    - Explicar o que é um arquivo Lottie e como ele difere de animações geradas por código.
    - Entender o fluxo After Effects → Bodymovin → JSON → player.
    - Exibir uma animação Lottie em uma página web.
  audience:
    - Desenvolvedores front-end e mobile.
    - Designers de movimento que entregam animações para produto.
  prerequisites:
    required:
      - HTML e JavaScript básicos.
    helpful:
      - Acesso ao After Effects (para criar animações; para apenas exibir, não é necessário).
  key_concepts: [animation-library, programmatic-animation]
  practical_applications:
    - Adicionar ícones animados e estados de carregamento leves a uma aplicação.
    - Integrar animações entregues por designers sem recriá-las em código.
  study_guide:
    - Leia a introdução do README e visite airbnb.io/lottie para a documentação.
    - Use um arquivo Lottie de exemplo e exiba-o com o player web.
    - Compare o resultado com uma animação equivalente feita com Motion para entender os trade-offs.
  related_resources: [motion, manim]
  github_highlights:
    - {path: build/, why: Builds do player e da extensão Bodymovin.}
    - {path: demo/, why: Demos de uso.}
    - {path: docs/, why: Documentação do projeto.}
  links:
    - {label: Ver documentação, url: "https://airbnb.io/lottie/"}
  verified:
    verified_on: 2026-11-19
    source_title: lottie-web
    license: MIT
    primary_language: JavaScript
    source_description: "Render After Effects animations natively on Web, Android and iOS, and React Native."
  metadata_status: verified

