# Taxonomia editorial da Resource Library.
#
# - use_cases: dimensao de descoberta por PROBLEMA (nao por tecnologia). `keywords` sao
#   termos (pt/en, sem acento) que, presentes na busca, ativam o caso de uso.
# - sections: as quatro secoes da Home, na ordem de exibicao. Cada recurso pertence a uma
#   subcategoria (editorial_subcategory); a secao e derivada dela. Quick Knowledge nao tem
#   subcategorias de recurso: e composto por notas, topic collections e playbooks.
# - technologies: nomes reconhecidos na deteccao de integracoes. A deteccao so SUGERE;
#   "Works with" exige evidencia (source_evidence) e revisao editorial.

use_cases:
  - id: automate_repetitive_tasks
    label: Automatizar tarefas repetitivas
    keywords: [automatizar, automacao, automatizacao, automate, automation, repetitiva, repetitivas, repetitive, manual, manuais, script, scripts, agendar, agendamento, schedule, cron, rotina]
  - id: validate_data
    label: Validar dados
    keywords: [validar, validacao, validate, validation, schema, assertion, assertions, checagem, check, checks, conferir]
  - id: review_code
    label: Revisar código
    keywords: [revisar, revisao, review, code review, pull request, pr, prs, lint]
  - id: document_process
    label: Documentar processos e sistemas
    keywords: [documentar, documentacao, document, documentation, docs, readme, especificacao, spec, template, templates]
  - id: orchestrate_workflow
    label: Orquestrar fluxos de trabalho
    keywords: [orquestrar, orquestracao, orchestrate, orchestration, workflow, workflows, pipeline, pipelines, jobs, job, dag, dependencias]
  - id: integrate_systems
    label: Integrar sistemas
    keywords: [integrar, integracao, integrate, integration, api, apis, rest, sdk, webhook, contrato, contract, handoff]
  - id: analyze_information
    label: Analisar informações
    keywords: [analisar, analise, analyze, analysis, sql, consulta, consultar, explorar, exploracao, pesquisa, research, papers, estatistica]
  - id: monitor_operations
    label: Monitorar operações
    keywords: [monitorar, monitoramento, monitor, monitoring, observabilidade, observability, logging, logs, alerta, alertas, tracing]
  - id: improve_data_quality
    label: Melhorar a qualidade de dados
    keywords: [qualidade, quality, limpeza, cleaning, deduplicar, duplicidade, consistencia, lineage, governanca, governance]
  - id: manage_requirements
    label: Gerenciar requisitos
    keywords: [requisito, requisitos, requirements, escopo, alinhar, alinhamento, discovery, especificar]
  - id: develop_ai_application
    label: Desenvolver aplicações de IA
    keywords: [llm, llms, rag, agente, agentes, agent, agents, ia, ai, genai, prompt, prompts, embeddings, claude, modelo de linguagem]
  - id: evaluate_model_outputs
    label: Avaliar resultados de modelos
    keywords: [avaliar, avaliacao, evaluate, evaluation, evals, eval, metrica, metricas, backtesting, benchmark, alucinacao]

